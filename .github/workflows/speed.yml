# PM-7 NEWS-SPEED COLLECTOR -- Pinnacle vs Kalshi vs Polymarket game prices every 2 minutes, around the clock, on GitHub's free runners.
# Each run loops ~5.7 hours (jobs max out at 6h) and commits once; a new run starts every 6 hours. Free public APIs, no secrets.
# Data: collected/speed/<UTC date>.jsonl.gz (only rows whose price changed + a heartbeat row per pass).
name: speed-collector

on:
  schedule:
    - cron: "17 */6 * * *"      # off the top of the hour: GitHub delays/drops :00 schedules under load
  workflow_dispatch:

concurrency:
  group: speed-collector        # separate from the trading runs so it never blocks them
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Collect for ~5.7 hours
        run: python collect_speed.py run 335
      - name: Commit the data
        if: always()
        run: |
          git config user.name "trading-desk-bot"
          git config user.email "trading-desk-bot@users.noreply.github.com"
          git add collected/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "speed data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 10; done
